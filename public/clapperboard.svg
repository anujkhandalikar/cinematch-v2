<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <ellipse cx="60" cy="110" rx="35" ry="6" fill="black" opacity="0.4"/>
  
  <!-- Main clapperboard body -->
  <rect x="22" y="42" width="76" height="48" rx="3" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="22" y="42" width="76" height="48" rx="3" fill="url(#bodyGradient)" opacity="0.8"/>
  
  <!-- Horizontal lines on body (text areas) -->
  <line x1="28" y1="55" x2="92" y2="55" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="28" y1="65" x2="92" y2="65" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="28" y1="75" x2="92" y2="75" stroke="#2a2a2a" stroke-width="1"/>
  
  <!-- Hinge mechanism -->
  <path d="M 22 42 L 22 52 L 16 52 L 16 46 L 22 42 Z" fill="#444"/>
  <path d="M 16 46 L 16 52 L 14 52 L 14 46 Z" fill="#666"/>
  <!-- Rivets -->
  <circle cx="19" cy="47" r="1.2" fill="#1a1a1a"/>
  <circle cx="19" cy="52" r="1.2" fill="#1a1a1a"/>
  <circle cx="17.5" cy="49.5" r="1.2" fill="#1a1a1a"/>
  
  <!-- Clapper stick (raised position) -->
  <g transform="rotate(-12 60 28)">
    <rect x="18" y="18" width="84" height="18" rx="2" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5"/>
    <rect x="18" y="18" width="84" height="18" rx="2" fill="url(#stickGradient)" opacity="0.9"/>
    
    <!-- Diagonal stripes (alternating black and silver) -->
    <g opacity="0.7">
      <line x1="24" y1="22" x2="32" y2="30" stroke="#666" stroke-width="2.5"/>
      <line x1="38" y1="22" x2="46" y2="30" stroke="#666" stroke-width="2.5"/>
      <line x1="52" y1="22" x2="60" y2="30" stroke="#666" stroke-width="2.5"/>
      <line x1="66" y1="22" x2="74" y2="30" stroke="#666" stroke-width="2.5"/>
      <line x1="80" y1="22" x2="88" y2="30" stroke="#666" stroke-width="2.5"/>
    </g>
    
    <!-- Highlight on clapper stick -->
    <rect x="18" y="18" width="84" height="4" rx="1" fill="#444" opacity="0.5"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stickGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>

